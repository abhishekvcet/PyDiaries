<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant</title>
</head>
<body>
    <h2>AI Assistant (Search + Voice)</h2>

    <form method="POST">
        <textarea name="text" rows="4" cols="60"
          placeholder="Ask me anything..."></textarea><br><br>
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
        <h3>AI Answer:</h3>
        <p>{{ answer }}</p>
        <audio controls autoplay>
            <source src="/static/output.mp3" type="audio/mpeg">
        </audio>
    {% endif %}
</body>
</html>
